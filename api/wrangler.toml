name = "hookpm-api"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "HOOKPM_BUCKET"
bucket_name = "hookpm-registry"
preview_bucket_name = "hookpm-registry-preview"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "82fe208ec28d4ae29ba6fcbd8e40f3bb"
preview_id = "99e10cb08ea64b2ab32996d7c68cba92"

# Secrets (set via `wrangler secret put`):
#   CLERK_JWKS_URL        — Clerk JWKS endpoint, e.g. https://clerk.hookpm.dev/.well-known/jwks.json
#   CLERK_ISSUER          — Clerk issuer URL, e.g. https://clerk.hookpm.dev
#   CLERK_OAUTH_URL       — Clerk OAuth authorize URL
#   CLERK_CLIENT_ID       — Clerk OAuth application client ID
#   CLERK_CLIENT_SECRET   — Clerk OAuth application client secret
#   SUPABASE_URL          — Supabase project URL (https://<project>.supabase.co)
#   SUPABASE_SERVICE_KEY  — Supabase service role key (read/write access)
#
# NOTE: __TEST_CLERK_USER is a TypeScript-only test injection field.
# It cannot be set via wrangler config and is never active in production.


[triggers]
crons = ["0 0 */5 * *"]

[env.production]
name = "hookpm-api"

[env.staging]
name = "hookpm-api-staging"

[[env.staging.r2_buckets]]
binding = "HOOKPM_BUCKET"
bucket_name = "hookpm-registry-preview"
